<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises Database</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" style="display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.5px;">
        <i class="fa-solid fa-dumbbell"></i> MuscleMap
      </div>
    </div>
    <div class="nav-right">
      <a href="login.html" class="login-link">Login / Register <i class="fa-solid fa-caret-down"></i></a>
    </div>
  </nav>

  <main class="page-container">
    <header class="page-header">
      <h1 class="page-title">Exercises</h1>

      <div class="header-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Search by exercise name" id="searchInput">
          <i class="fa-solid fa-caret-down dropdown-icon"></i>
        </div>
        <button class="btn-primary"><i class="fa-solid fa-plus"></i> CONTRIBUTE AN EXERCISE</button>
      </div>
    </header>

    <div class="content-layout">
      <!-- Sidebar Filters -->
      <aside class="sidebar" id="sidebar">
        <!-- Rendered via JS to maintain simplicity, but we can hardcode for identical layout -->
        <div class="filter-group">
          <h3 class="filter-title">Category</h3>
          <div class="filter-list" id="category-filters">
            <!-- Toggles generated by DOM -->
          </div>
        </div>

        <div class="filter-group">
          <h3 class="filter-title">Equipment</h3>
          <div class="filter-list" id="equipment-filters">
            <!-- Toggles generated by DOM -->
          </div>
        </div>
      </aside>

      <!-- Main Exercise Grid -->
      <section class="main-content">
        <!-- Loading State -->
        <div id="loader" class="loader-container">
          <div class="spinner"></div>
          <p>Loading exercises...</p>
        </div>

        <!-- The Grid -->
        <div id="exercise-grid" class="exercise-grid hidden">
          <!-- Exercise Cards will be injected here via JS -->
        </div>

        <!-- No Results Message -->
        <div id="no-results" class="no-results hidden">
          <h2>No exercises found.</h2>
          <p>Try adjusting your filters or search query.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>

</html>
